<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plaquinhas QR Code · Cardápio Digital</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;600&display=swap">
  <style>
    :root { --cor: #e11d48; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f2f4; color: #16171a; font: 15px/1.5 'Inter', system-ui, sans-serif; }
    .painel { max-width: 1040px; margin: 0 auto; padding: 28px 16px; }
    h1 { font: 800 1.6rem 'Poppins', sans-serif; margin: 0 0 4px; }
    .painel > p { color: #666; margin: 0 0 20px; }
    form { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    label { display: grid; gap: 4px; font-weight: 600; font-size: .85rem; }
    input { padding: 10px 12px; border: 1px solid #d8d9de; border-radius: 10px; font: inherit; width: 100%; }
    input[type=color] { padding: 4px; height: 42px; }
    .wide { grid-column: 1 / -1; }
    .acoes { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; }
    button { padding: 12px 20px; border: 0; border-radius: 99px; background: #16171a; color: #fff; font: 700 .95rem 'Inter', sans-serif; cursor: pointer; }
    button.sec { background: #e4e5e9; color: #16171a; }
    .placas { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-top: 24px; }
    .placa { background: #fff; border-radius: 18px; overflow: hidden; text-align: center; border: 1px solid #e3e4e8; break-inside: avoid; page-break-inside: avoid; }
    .placa header { background: var(--cor); color: #fff; padding: 14px 12px; }
    .placa header b { display: block; font: 800 1.2rem 'Poppins', sans-serif; line-height: 1.2; }
    .placa header span { font-size: .8rem; opacity: .9; }
    .placa .qr { display: inline-block; padding: 14px 14px 6px; }
    .placa .qr img, .placa .qr canvas { width: 170px !important; height: 170px !important; }
    .placa .mesa { font: 800 1.4rem 'Poppins', sans-serif; color: var(--cor); margin: 0; }
    .placa p { margin: 4px 14px; font-size: .82rem; color: #555; }
    .placa footer { margin-top: 10px; padding: 8px; background: #f6f6f8; font-size: .74rem; color: #666; }
    @media print {
      body { background: #fff; }
      .painel > *:not(.placas) { display: none; }
      .painel { padding: 0; max-width: none; }
      .placas { grid-template-columns: repeat(3, 1fr); gap: 10mm; margin: 0; }
      .placa { border: 1px dashed #bbb; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      @page { margin: 10mm; }
    }
  </style>
</head>
<body>
  <div class="painel">
    <h1>Plaquinhas com QR Code</h1>
    <p>Gere as plaquinhas para mesas, balcão e embalagens. Com mesas numeradas, o pedido chega no WhatsApp já com o número da mesa.</p>
    <form>
      <label class="wide">Endereço do cardápio (link publicado)<input name="url" type="url" required placeholder="https://..."></label>
      <label>Nome do estabelecimento<input name="nome"></label>
      <label>Quantidade de mesas<input name="mesas" type="number" min="0" max="200" value="0"><small style="font-weight:400;color:#777">0 = uma plaquinha geral</small></label>
      <label>Cor<input name="cor" type="color" value="#e11d48"></label>
      <label>Texto de chamada<input name="texto" value="Aponte a câmera e veja nosso cardápio"></label>
      <label>Wi-Fi (opcional)<input name="wifi" placeholder="Rede: Casa · Senha: 12345678"></label>
      <div class="acoes"><button type="submit">Gerar plaquinhas</button><button type="button" class="sec" data-print>Imprimir</button></div>
    </form>
    <div class="placas"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      var form = document.querySelector('form'), saida = document.querySelector('.placas');
      var p = new URLSearchParams(location.search);
      ['url', 'nome', 'mesas'].forEach(function (k) { if (p.get(k)) form[k].value = p.get(k); });
      function qr(el, texto) {
        if (window.QRCode) new QRCode(el, { text: texto, width: 340, height: 340, correctLevel: QRCode.CorrectLevel.M });
        else { var i = new Image(); i.alt = 'QR Code'; i.src = 'https://api.qrserver.com/v1/create-qr-code/?size=340x340&data=' + encodeURIComponent(texto); el.appendChild(i); }
      }
      function placa(url, mesa) {
        var d = document.createElement('article'); d.className = 'placa';
        var h = document.createElement('header');
        var b = document.createElement('b'); b.textContent = form.nome.value || 'Cardápio Digital';
        var s = document.createElement('span'); s.textContent = 'Cardápio digital';
        h.append(b, s);
        var q = document.createElement('div'); q.className = 'qr';
        d.append(h, q);
        if (mesa) { var m = document.createElement('p'); m.className = 'mesa'; m.textContent = 'Mesa ' + mesa; d.append(m); }
        var t = document.createElement('p'); t.textContent = form.texto.value; d.append(t);
        if (form.wifi.value) { var w = document.createElement('footer'); w.textContent = 'Wi-Fi · ' + form.wifi.value; d.append(w); }
        saida.append(d);
        qr(q, url);
      }
      function gerar() {
        saida.innerHTML = '';
        document.documentElement.style.setProperty('--cor', form.cor.value);
        var url = form.url.value.trim(); if (!url) return;
        var n = Math.min(200, Math.max(0, parseInt(form.mesas.value, 10) || 0));
        if (!n) { placa(url); return; }
        for (var i = 1; i <= n; i++) {
          var u = new URL(url); u.searchParams.set('mesa', i);
          placa(u.href, i);
        }
      }
      form.addEventListener('submit', function (e) { e.preventDefault(); gerar(); });
      form.cor.addEventListener('input', function () { document.documentElement.style.setProperty('--cor', form.cor.value); });
      document.querySelector('[data-print]').addEventListener('click', function () { if (!saida.children.length) gerar(); window.print(); });
      if (form.url.value) gerar();
    })();
  </script>
</body>
</html>
